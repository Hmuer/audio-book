# P2 #13：依赖锁定（lock file）—— 通过 `pip freeze` 生成，禁止手工编辑。
#
# 锁定原理：
#   - requirements.txt 是 "约束"（约束了最低版本 + 主要版本兼容）
#   - requirements.lock 是 "锁定的实际安装版本"（pip freeze 输出）
#   - CI/生产/开发都必须用 lock；升级时改 lock 不动 requirements.txt
#   - 升级流程：先改 requirements.txt 的 `>=` 边界 →再 pip install →再 pip freeze >> lock
#
# 本文件由脚本生成（见 README）：
#   cd backend && pip freeze | grep -F -f <(awk '/^[A-Za-z]/{print $1}' requirements.txt) > requirements.lock

